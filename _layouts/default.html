<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/diablo.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="site-tagline">~ descend, adventurer ~</div>
  </header>

  <main>
    {{ content }}
    {% if page.layout != 'floor' and page.url != '/' %}
    <div class="floor-nav-wrap floor-nav-bottom">
      <nav class="floor-nav floor-nav-single" aria-label="Page navigation">
        <a class="floor-nav-link toc" href="{{ '/' | relative_url }}">
          <span class="floor-nav-text">
            <span class="floor-nav-label">The Hold</span>
            <span class="floor-nav-title">Back to the Dungeon Map</span>
          </span>
        </a>
      </nav>
    </div>
    {% endif %}
  </main>

  <footer class="site-footer">
    COMP 2450 · Harding University · {{ site.time | date: '%Y' }}
  </footer>
</body>
</html>
