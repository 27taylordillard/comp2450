<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="bd-title bd-desc">
  <title id="bd-title">Breadth-first vs depth-first — same map, two orders</title>
  <desc id="bd-desc">Two crossings of the same small map from the same start room, side by side. On the left, breadth-first search using a FIFO queue: the start room is shaded, then its immediate neighbours are shaded as level 1, then their neighbours as level 2, in concentric rings fanning outward; a small queue diagram shows rooms entering at the back and leaving at the front. On the right, depth-first search using a LIFO stack: a single bold path plunges from the start straight down one chain of rooms to a dead end, then a dashed backtrack line returns and takes a different branch; a small stack diagram shows rooms pushed and popped from the top. Both share a visited-set box listing the rooms already seen, identical between the two.</desc>
  <style>
    .panel       { fill: #f6efd5; stroke: #8b5a00; stroke-width: 0.8; opacity: 0.4; }
    .col-bg-left { fill: #faf3dc; stroke: #8b5a00; stroke-width: 1.0; opacity: 0.5; }
    .col-bg-right{ fill: #faecd4; stroke: #6b0f0f; stroke-width: 1.0; opacity: 0.5; }
    .ring        { fill: none; stroke: #8b5a00; stroke-width: 0.8; stroke-dasharray: 3 3; opacity: 0.45; }
    .node        { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.3; }
    .node-root   { fill: #eacf85; stroke: #6b0f0f; stroke-width: 1.8; }
    .lvl0        { fill: #eacf85; stroke: #6b0f0f; stroke-width: 1.8; }
    .lvl1        { fill: #f0dca0; stroke: #8b5a00; stroke-width: 1.3; }
    .lvl2        { fill: #f4e6bc; stroke: #8b5a00; stroke-width: 1.3; }
    .lvl3        { fill: #f8eecf; stroke: #8b5a00; stroke-width: 1.3; }
    .lvl4        { fill: #fbf4dd; stroke: #8b5a00; stroke-width: 1.3; }
    .lvl5        { fill: #fdf9ec; stroke: #8b5a00; stroke-width: 1.3; }
    .edge        { stroke: #8b5a00; stroke-width: 1.2; fill: none; opacity: 0.7; }
    .edge-cycle  { stroke: #6b0f0f; stroke-width: 1.4; fill: none; opacity: 0.55; stroke-dasharray: 2 2; }
    .edge-plunge { stroke: #6b0f0f; stroke-width: 3.0; fill: none; opacity: 0.95; stroke-linecap: round; }
    .edge-back   { stroke: #6b0f0f; stroke-width: 1.6; fill: none; opacity: 0.8; stroke-dasharray: 5 4; stroke-linecap: round; }
    .edge-branch { stroke: #6b0f0f; stroke-width: 2.4; fill: none; opacity: 0.9; stroke-linecap: round; }
    .node-label  { font-family: Consolas, 'Courier New', monospace; font-size: 9.5px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .badge       { fill: #6b0f0f; }
    .badge-text  { font-family: Consolas, 'Courier New', monospace; font-size: 9.5px; fill: #f6efd5; font-weight: 700; text-anchor: middle; }
    .panel-title { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.10em; }
    .subtitle    { font-family: Georgia, serif; font-size: 11px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }
    .col-title   { font-family: Georgia, serif; font-size: 13px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; letter-spacing: 0.06em; }
    .col-tag     { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #4a3a2a; text-anchor: middle; }
    .lvl-tag     { font-family: Consolas, 'Courier New', monospace; font-size: 9px; fill: #8b5a00; text-anchor: end; }
    .strip-title { font-family: Georgia, serif; font-size: 9.5px; fill: #8b5a00; font-style: italic; text-transform: uppercase; letter-spacing: 0.06em; text-anchor: middle; }
    .cell        { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.0; }
    .cell-head   { fill: #eacf85; stroke: #8b5a00; stroke-width: 1.2; }
    .cell-label  { font-family: Consolas, 'Courier New', monospace; font-size: 8.5px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .op-small    { font-family: Consolas, 'Courier New', monospace; font-size: 9.5px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
    .ptr-text    { font-family: Consolas, 'Courier New', monospace; font-size: 9px; fill: #8b5a00; font-weight: 700; text-anchor: middle; }
    .order       { font-family: Consolas, 'Courier New', monospace; font-size: 10px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .col-caption { font-family: Georgia, serif; font-size: 11px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }
    .vset-box    { fill: #fdf4d3; stroke: #4a6b0f; stroke-width: 1.6; }
    .vset-title  { font-family: Georgia, serif; font-size: 11px; fill: #4a6b0f; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.06em; }
    .vset-code   { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .note-strong { font-family: Georgia, serif; font-size: 11.5px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
  </style>

  <defs>
    <!-- clip the BFS level rings to the left panel so they never spill out of it -->
    <clipPath id="bfs-left-clip"><rect x="22" y="122" width="368" height="320" rx="6"/></clipPath>
  </defs>

  <rect class="panel" x="10" y="10" width="780" height="480" rx="6"/>
  <text class="panel-title" x="400" y="30">same map, same start, two orders</text>
  <text class="subtitle"    x="400" y="48">a FIFO queue fans out in rings; a LIFO stack plunges down one passage</text>

  <!-- legend of abbreviations -->
  <text class="col-caption" x="400" y="66" style="font-size:9.5px">En=Entrance · Gob=Goblin · Skel=Skeleton · Wr=Wraith · Necro=Necrothrall · SH=Shadow Hound</text>

  <!-- ===================== LEFT: BFS ===================== -->
  <rect class="col-bg-left" x="20" y="76" width="372" height="368" rx="6"/>
  <text class="col-title" x="206" y="98">BFS · FIFO Queue</text>
  <text class="col-tag"   x="206" y="115">fan out in rings, level by level</text>

  <!-- concentric level rings centred on Entrance (160,158); clipped to the panel so they
       read as fanning arcs without spilling out the top/left or into the queue strip -->
  <g clip-path="url(#bfs-left-clip)">
    <circle class="ring" cx="160" cy="158" r="54"/>
    <circle class="ring" cx="160" cy="158" r="92"/>
    <circle class="ring" cx="160" cy="158" r="130"/>
  </g>

  <!-- edges -->
  <line class="edge" x1="160" y1="158" x2="118" y2="206"/>
  <line class="edge" x1="160" y1="158" x2="220" y2="206"/>
  <line class="edge-cycle" x1="118" y1="206" x2="220" y2="206"/>
  <line class="edge" x1="118" y1="206" x2="95"  y2="262"/>
  <line class="edge" x1="220" y1="206" x2="232" y2="262"/>
  <line class="edge" x1="95"  y1="262" x2="72"  y2="322"/>
  <line class="edge" x1="95"  y1="262" x2="168" y2="322"/>
  <line class="edge" x1="232" y1="262" x2="168" y2="322"/>
  <line class="edge" x1="168" y1="322" x2="222" y2="372"/>
  <line class="edge" x1="222" y1="372" x2="182" y2="416"/>

  <!-- nodes with BFS badges: En1 Gob2 Skel3 Wr4 Necro5 SH6 Lich7 Stair8 Frost9 -->
  <circle class="lvl0" cx="160" cy="158" r="16"/><text class="node-label" x="160" y="161">En</text>
  <circle class="badge" cx="176" cy="144" r="8"/><text class="badge-text" x="176" y="147">1</text>

  <circle class="lvl1" cx="118" cy="206" r="15"/><text class="node-label" x="118" y="209">Gob</text>
  <circle class="badge" cx="133" cy="193" r="8"/><text class="badge-text" x="133" y="196">2</text>

  <circle class="lvl1" cx="220" cy="206" r="15"/><text class="node-label" x="220" y="209">Skel</text>
  <circle class="badge" cx="235" cy="193" r="8"/><text class="badge-text" x="235" y="196">3</text>

  <circle class="lvl2" cx="95" cy="262" r="15"/><text class="node-label" x="95" y="265">Wr</text>
  <circle class="badge" cx="110" cy="249" r="8"/><text class="badge-text" x="110" y="252">4</text>

  <circle class="lvl2" cx="232" cy="262" r="16"/><text class="node-label" x="232" y="265">Necro</text>
  <circle class="badge" cx="248" cy="249" r="8"/><text class="badge-text" x="248" y="252">5</text>

  <circle class="lvl3" cx="72" cy="322" r="15"/><text class="node-label" x="72" y="325">SH</text>
  <circle class="badge" cx="57" cy="309" r="8"/><text class="badge-text" x="57" y="312">6</text>

  <circle class="lvl3" cx="168" cy="322" r="14"/><text class="node-label" x="168" y="325">Lich</text>
  <circle class="badge" cx="183" cy="310" r="8"/><text class="badge-text" x="183" y="313">7</text>

  <circle class="lvl4" cx="222" cy="372" r="14"/><text class="node-label" x="222" y="375">Stair</text>
  <circle class="badge" cx="237" cy="360" r="8"/><text class="badge-text" x="237" y="363">8</text>

  <circle class="lvl5" cx="182" cy="416" r="15"/><text class="node-label" x="182" y="419">Frost</text>
  <circle class="badge" cx="197" cy="404" r="8"/><text class="badge-text" x="197" y="407">9</text>

  <!-- queue strip (horizontal): rooms enter at back, leave at front -->
  <text class="strip-title" x="316" y="150">FIFO queue</text>
  <rect class="cell-head" x="296" y="160" width="22" height="20" rx="2"/><text class="cell-label" x="307" y="173">Wr</text>
  <rect class="cell" x="318" y="160" width="26" height="20" rx="2"/><text class="cell-label" x="331" y="173">Necro</text>
  <rect class="cell" x="344" y="160" width="22" height="20" rx="2"/><text class="cell-label" x="355" y="173">SH</text>
  <text class="ptr-text" x="307" y="194">front</text>
  <text class="ptr-text" x="355" y="194">back</text>
  <text class="op-small" x="331" y="216" style="font-size:8.5px">leave front · enter back</text>

  <text class="order"       x="206" y="416" style="opacity:0">x</text>
  <text class="col-caption" x="206" y="436">En · Gob · Skel · Wr · Necro · SH · Lich · Stair · Frost</text>

  <!-- ===================== RIGHT: DFS ===================== -->
  <rect class="col-bg-right" x="408" y="76" width="372" height="368" rx="6"/>
  <text class="col-title" x="594" y="98">DFS · LIFO Stack</text>
  <text class="col-tag"   x="594" y="115">plunge down one passage, then backtrack</text>

  <!-- faint base edges -->
  <line class="edge" x1="548" y1="158" x2="506" y2="206"/>
  <line class="edge-cycle" x1="506" y1="206" x2="608" y2="206"/>
  <line class="edge" x1="506" y1="206" x2="483" y2="262"/>
  <line class="edge" x1="483" y1="262" x2="556" y2="322"/>

  <!-- bold plunge path En->Skel->Necro->Lich->Stair->Frost -->
  <path class="edge-plunge" d="M548,158 L608,206 L620,262 L556,322 L610,372 L570,416"/>

  <!-- branch: Wr->SH (taken after backtrack) -->
  <line class="edge-branch" x1="483" y1="262" x2="460" y2="322"/>

  <!-- dashed backtrack: from the dead-end chain back up to Wraith -->
  <path class="edge-back" d="M556,322 C520,300 500,285 489,278"/>

  <!-- nodes with DFS badges: En1 Skel2 Necro3 Lich4 Stair5 Frost6 Wr7 SH8 Gob9 -->
  <circle class="node-root" cx="548" cy="158" r="16"/><text class="node-label" x="548" y="161">En</text>
  <circle class="badge" cx="564" cy="144" r="8"/><text class="badge-text" x="564" y="147">1</text>

  <circle class="node" cx="506" cy="206" r="15"/><text class="node-label" x="506" y="209">Gob</text>
  <circle class="badge" cx="491" cy="193" r="8"/><text class="badge-text" x="491" y="196">9</text>

  <circle class="node" cx="608" cy="206" r="15"/><text class="node-label" x="608" y="209">Skel</text>
  <circle class="badge" cx="623" cy="193" r="8"/><text class="badge-text" x="623" y="196">2</text>

  <circle class="node" cx="483" cy="262" r="15"/><text class="node-label" x="483" y="265">Wr</text>
  <circle class="badge" cx="468" cy="249" r="8"/><text class="badge-text" x="468" y="252">7</text>

  <circle class="node" cx="620" cy="262" r="16"/><text class="node-label" x="620" y="265">Necro</text>
  <circle class="badge" cx="636" cy="249" r="8"/><text class="badge-text" x="636" y="252">3</text>

  <circle class="node" cx="460" cy="322" r="15"/><text class="node-label" x="460" y="325">SH</text>
  <circle class="badge" cx="445" cy="309" r="8"/><text class="badge-text" x="445" y="312">8</text>

  <circle class="node" cx="556" cy="322" r="14"/><text class="node-label" x="556" y="325">Lich</text>
  <circle class="badge" cx="571" cy="310" r="8"/><text class="badge-text" x="571" y="313">4</text>

  <circle class="node" cx="610" cy="372" r="14"/><text class="node-label" x="610" y="375">Stair</text>
  <circle class="badge" cx="625" cy="360" r="8"/><text class="badge-text" x="625" y="363">5</text>

  <circle class="node" cx="570" cy="416" r="15"/><text class="node-label" x="570" y="419">Frost</text>
  <circle class="badge" cx="585" cy="404" r="8"/><text class="badge-text" x="585" y="407">6</text>

  <text class="op-small" x="500" y="300" style="font-size:8px;fill:#6b0f0f">backtrack</text>

  <!-- stack strip (vertical): push/pop at top -->
  <text class="strip-title" x="712" y="138">LIFO stack</text>
  <text class="ptr-text" x="712" y="154">top ↑ push / pop</text>
  <rect class="cell-head" x="690" y="160" width="44" height="18" rx="2"/><text class="cell-label" x="712" y="172">Lich</text>
  <rect class="cell" x="690" y="178" width="44" height="18" rx="2"/><text class="cell-label" x="712" y="190">Necro</text>
  <rect class="cell" x="690" y="196" width="44" height="18" rx="2"/><text class="cell-label" x="712" y="208">Skel</text>
  <rect class="cell" x="690" y="214" width="44" height="18" rx="2"/><text class="cell-label" x="712" y="226">En</text>
  <text class="op-small" x="712" y="244" style="font-size:8.5px">push / pop on top</text>

  <text class="col-caption" x="594" y="436">En · Skel · Necro · Lich · Stair · Frost · Wr · SH · Gob</text>

  <!-- ===================== SHARED visited-set box ===================== -->
  <rect class="vset-box" x="150" y="456" width="500" height="28" rx="5"/>
  <text class="vset-title" x="186" y="474">visited</text>
  <text class="vset-code" x="430" y="474">{ En, Gob, Skel, Wr, Necro, SH, Lich, Stair, Frost }  — same for both</text>
</svg>
