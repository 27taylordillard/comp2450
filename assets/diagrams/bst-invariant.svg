<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="bi-title bi-desc">
  <title id="bi-title">The binary-search-tree invariant — search for 7 discards half the tree at each step</title>
  <desc id="bi-desc">A binary search tree rooted at 8, with 3 on the left and 10 on the right; 3 has children 1 and 6; 6 has children 4 and 7; 10 has a right child 14, which has a left child 13. A search for 7 is traced along bold edges: at 8, since 7 is less than 8, go left and discard the entire right subtree (10, 14, 13); at 3, since 7 is greater than 3, go right and discard 1; at 6, since 7 is greater than 6, go right and discard 4; arrive at 7. The discarded nodes are faded. A side list shows the three comparisons. Roughly half of what remains falls away at each comparison, so a nine-node tree is searched in three steps.</desc>
  <style>
    .panel       { fill: #f6efd5; stroke: #8b5a00; stroke-width: 0.8; opacity: 0.4; }
    .node        { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.6; }
    .node-root   { fill: #eacf85; stroke: #6b0f0f; stroke-width: 2.0; }
    .node-path   { fill: #eacf85; stroke: #6b0f0f; stroke-width: 2.4; }
    .node-found  { fill: #e7efcf; stroke: #4a6b0f; stroke-width: 2.6; }
    .node-faded  { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.4; opacity: 0.30; }
    .edge        { stroke: #8b5a00; stroke-width: 1.6; fill: none; }
    .edge-faded  { stroke: #8b5a00; stroke-width: 1.4; fill: none; opacity: 0.25; }
    .edge-path   { stroke: #6b0f0f; stroke-width: 3.2; fill: none; }
    .node-label  { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .label-faded { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; opacity: 0.35; }
    .badge       { fill: #6b0f0f; }
    .badge-found { fill: #4a6b0f; }
    .badge-text  { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #f6efd5; font-weight: 700; text-anchor: middle; }
    .panel-title { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.10em; }
    .subtitle    { font-family: Georgia, serif; font-size: 11px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }
    .steps-title { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: start; letter-spacing: 0.04em; }
    .step        { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #2a1a0a; text-anchor: start; }
    .callout-sub { font-family: Georgia, serif; font-size: 10.5px; fill: #8b5a00; font-style: italic; text-anchor: middle; opacity: 0.85; }
    .note-strong { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
  </style>

  <rect class="panel" x="10" y="10" width="740" height="420" rx="6"/>
  <text class="panel-title" x="380" y="30">one rule: left &lt; node &lt; right</text>
  <text class="subtitle"    x="380" y="48">to find a value you compare once and go ONE way — each step discards a whole subtree</text>

  <!-- edges (faded ones first, then path on top) -->
  <line class="edge-faded" x1="290" y1="120" x2="430" y2="195"/>
  <line class="edge-faded" x1="175" y1="195" x2="110" y2="270"/>
  <line class="edge-faded" x1="430" y1="195" x2="500" y2="270"/>
  <line class="edge-faded" x1="250" y1="270" x2="205" y2="345"/>
  <line class="edge-faded" x1="500" y1="270" x2="455" y2="345"/>
  <line class="edge-path"  x1="290" y1="120" x2="175" y2="195"/>
  <line class="edge-path"  x1="175" y1="195" x2="250" y2="270"/>
  <line class="edge-path"  x1="250" y1="270" x2="290" y2="345"/>

  <!-- discarded nodes -->
  <circle class="node-faded" cx="430" cy="195" r="18"/><text class="label-faded" x="430" y="200">10</text>
  <circle class="node-faded" cx="110" cy="270" r="18"/><text class="label-faded" x="110" y="275">1</text>
  <circle class="node-faded" cx="500" cy="270" r="18"/><text class="label-faded" x="500" y="275">14</text>
  <circle class="node-faded" cx="205" cy="345" r="18"/><text class="label-faded" x="205" y="350">4</text>
  <circle class="node-faded" cx="455" cy="345" r="18"/><text class="label-faded" x="455" y="350">13</text>

  <!-- path nodes -->
  <circle class="node-path" cx="290" cy="120" r="18"/><text class="node-label" x="290" y="125">8</text>
  <circle class="badge" cx="309" cy="105" r="9"/><text class="badge-text" x="309" y="108.5">1</text>
  <circle class="node-path" cx="175" cy="195" r="18"/><text class="node-label" x="175" y="200">3</text>
  <circle class="badge" cx="194" cy="180" r="9"/><text class="badge-text" x="194" y="183.5">2</text>
  <circle class="node-path" cx="250" cy="270" r="18"/><text class="node-label" x="250" y="275">6</text>
  <circle class="badge" cx="269" cy="255" r="9"/><text class="badge-text" x="269" y="258.5">3</text>
  <circle class="node-found" cx="290" cy="345" r="18"/><text class="node-label" x="290" y="350">7</text>
  <circle class="badge-found" cx="309" cy="330" r="9"/><text class="badge-text" x="309" y="333.5">✓</text>

  <!-- 'half skipped' note under the right subtree -->
  <text class="callout-sub" x="465" y="392">everything &gt; 8 — skipped at step ①</text>

  <!-- the walk, as a side list -->
  <text class="steps-title" x="592" y="150">the walk to 7</text>
  <text class="step" x="592" y="178">① 7 &lt; 8  → left</text>
  <text class="step" x="592" y="204">② 7 &gt; 3  → right</text>
  <text class="step" x="592" y="230">③ 7 &gt; 6  → right</text>
  <text class="step" x="592" y="256">✓  found 7</text>

  <text class="note-strong" x="380" y="416">find(7): 3 comparisons over 9 nodes — each step throws away about half</text>
</svg>
