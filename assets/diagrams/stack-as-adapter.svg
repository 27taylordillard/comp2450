<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="adapter-title adapter-desc">
  <title id="adapter-title">Stack&lt;T&gt; is an adapter over Chain&lt;T&gt;</title>
  <desc id="adapter-desc">Two stacked boxes shown side by side. Left box labelled Stack&lt;T&gt;, the ADT, listing five method signatures: push, pop, top, size, empty. Right box labelled Chain&lt;T&gt;, the data structure, listing five corresponding methods: push_front, pop_front, head dereferenced data, size, empty. Five horizontal arrows connect each Stack method to its Chain delegate. A label above the left box reads ADT — the promise. A label above the right box reads data structure — the storage. A note at the bottom: std::stack adapts std::deque by default — same pattern, same five delegates.</desc>
  <style>
    .panel       { fill: #f6efd5; stroke: #8b5a00; stroke-width: 0.8; opacity: 0.4; }

    .adt-box        { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.8; }
    .adt-box-header { fill: #eacf85; stroke: #8b5a00; stroke-width: 1.8; }
    .ds-box         { fill: #fdf4d3; stroke: #6b0f0f; stroke-width: 1.6; }
    .ds-box-header  { fill: #f2c89c; stroke: #6b0f0f; stroke-width: 1.6; }
    .method-divider { stroke: #8b5a00; stroke-width: 0.6; opacity: 0.45; }

    .arrow-line  { stroke: #6b0f0f; stroke-width: 1.6; fill: none; stroke-linecap: round; }
    .arrow-fill  { fill: #6b0f0f; }

    .panel-title { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.10em; }
    .subtitle    { font-family: Georgia, serif; font-size: 11px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }

    .box-name    { font-family: Consolas, 'Courier New', monospace; font-size: 18px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .layer-tag   { font-family: Georgia, serif; font-size: 11px; fill: #8b5a00; font-style: italic; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.08em; }
    .layer-line  { font-family: Georgia, serif; font-size: 10px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }

    .method      { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #2a1a0a; font-weight: 700; text-anchor: start; }
    .method-end  { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #2a1a0a; font-weight: 700; text-anchor: end; }
    .delegate    { font-family: Consolas, 'Courier New', monospace; font-size: 10px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; font-style: italic; }

    .note        { font-family: Georgia, serif; font-size: 11.5px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }
    .note-strong { font-family: Georgia, serif; font-size: 11.5px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
  </style>

  <!-- panel background -->
  <rect class="panel" x="10" y="10" width="740" height="400" rx="6"/>
  <text class="panel-title" x="380" y="28">Stack&lt;T&gt; is an adapter over Chain&lt;T&gt;</text>
  <text class="subtitle"    x="380" y="48">five one-line delegates — that is the entire implementation</text>

  <!-- ============================ layer labels ============================ -->
  <text class="layer-tag" x="170" y="76">ADT</text>
  <text class="layer-line" x="170" y="90">the promise — LIFO</text>

  <text class="layer-tag" x="590" y="76">data structure</text>
  <text class="layer-line" x="590" y="90">the storage — doubly-linked nodes</text>

  <!-- ============================ Stack<T> box on the left ============================ -->
  <!-- header bar -->
  <rect class="adt-box-header" x="50" y="100" width="240" height="36" rx="4"/>
  <text class="box-name" x="170" y="125">Stack&lt;T&gt;</text>
  <!-- body -->
  <rect class="adt-box" x="50" y="136" width="240" height="200" rx="4"/>

  <!-- method rows in Stack<T>: y at 162, 200, 238, 276, 314 -->
  <text class="method-end" x="270" y="167">push(x)</text>
  <line class="method-divider" x1="60" y1="178" x2="280" y2="178"/>
  <text class="method-end" x="270" y="205">pop()</text>
  <line class="method-divider" x1="60" y1="216" x2="280" y2="216"/>
  <text class="method-end" x="270" y="243">top()</text>
  <line class="method-divider" x1="60" y1="254" x2="280" y2="254"/>
  <text class="method-end" x="270" y="281">size()</text>
  <line class="method-divider" x1="60" y1="292" x2="280" y2="292"/>
  <text class="method-end" x="270" y="319">empty()</text>

  <!-- ============================ Chain<T> box on the right ============================ -->
  <!-- header bar -->
  <rect class="ds-box-header" x="470" y="100" width="240" height="36" rx="4"/>
  <text class="box-name" x="590" y="125">Chain&lt;T&gt;</text>
  <!-- body -->
  <rect class="ds-box" x="470" y="136" width="240" height="200" rx="4"/>

  <!-- corresponding method rows in Chain<T> -->
  <text class="method" x="488" y="167">chain_.push_front(x)</text>
  <line class="method-divider" x1="480" y1="178" x2="700" y2="178"/>
  <text class="method" x="488" y="205">chain_.pop_front()</text>
  <line class="method-divider" x1="480" y1="216" x2="700" y2="216"/>
  <text class="method" x="488" y="243">chain_.head()-&gt;data</text>
  <line class="method-divider" x1="480" y1="254" x2="700" y2="254"/>
  <text class="method" x="488" y="281">chain_.size()</text>
  <line class="method-divider" x1="480" y1="292" x2="700" y2="292"/>
  <text class="method" x="488" y="319">chain_.empty()</text>

  <!-- ============================ delegation arrows ============================ -->
  <!-- Each arrow goes from the right edge of the Stack<T> box (x=290) to the left edge of Chain<T> box (x=470). Y centred on each method row. -->

  <!-- push → push_front -->
  <line class="arrow-line" x1="294" y1="162" x2="458" y2="162"/>
  <polygon class="arrow-fill" points="458,158 468,162 458,166"/>
  <text class="delegate" x="376" y="156">delegates to</text>

  <!-- pop → pop_front -->
  <line class="arrow-line" x1="294" y1="200" x2="458" y2="200"/>
  <polygon class="arrow-fill" points="458,196 468,200 458,204"/>
  <text class="delegate" x="376" y="194">delegates to</text>

  <!-- top → head()->data -->
  <line class="arrow-line" x1="294" y1="238" x2="458" y2="238"/>
  <polygon class="arrow-fill" points="458,234 468,238 458,242"/>
  <text class="delegate" x="376" y="232">delegates to</text>

  <!-- size → size -->
  <line class="arrow-line" x1="294" y1="276" x2="458" y2="276"/>
  <polygon class="arrow-fill" points="458,272 468,276 458,280"/>
  <text class="delegate" x="376" y="270">delegates to</text>

  <!-- empty → empty -->
  <line class="arrow-line" x1="294" y1="314" x2="458" y2="314"/>
  <polygon class="arrow-fill" points="458,310 468,314 458,318"/>
  <text class="delegate" x="376" y="308">delegates to</text>

  <!-- ============================ bottom note ============================ -->
  <text class="note-strong" x="380" y="368">std::stack adapts std::deque by default — same pattern, same five delegates</text>
  <text class="note" x="380" y="386">the ADT lives on the outside; the storage lives on the inside; the bodies are the bridge</text>
</svg>
