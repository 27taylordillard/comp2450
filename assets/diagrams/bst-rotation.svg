<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="rot-title rot-desc">
  <title id="rot-title">A left rotation re-levels a subtree without changing its in-order order</title>
  <desc id="rot-desc">On the left, a right-leaning stick: node 1 is the root, its right child is 2, and 2's right child is 3 — height 2. A labelled arrow reads rotate left at 1. On the right, the result: 2 is now the root, with 1 as its left child and 3 as its right child — height 1. Beneath each tree the in-order traversal is written out as 1, 2, 3, identical for both. The caption states that the order is unchanged, which is why a rotation always produces a valid binary search tree.</desc>
  <style>
    .panel       { fill: #f6efd5; stroke: #8b5a00; stroke-width: 0.8; opacity: 0.4; }
    .node        { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.6; }
    .node-root   { fill: #eacf85; stroke: #6b0f0f; stroke-width: 2.2; }
    .edge        { stroke: #8b5a00; stroke-width: 1.6; fill: none; }
    .arrow-line  { stroke: #6b0f0f; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .arrow-fill  { fill: #6b0f0f; }
    .node-label  { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .panel-title { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.10em; }
    .subtitle    { font-family: Georgia, serif; font-size: 11px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }
    .op-label    { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
    .state       { font-family: Georgia, serif; font-size: 11px; fill: #8b5a00; font-style: italic; text-anchor: middle; }
    .inorder     { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .note-strong { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
  </style>

  <rect class="panel" x="10" y="10" width="740" height="340" rx="6"/>
  <text class="panel-title" x="380" y="30">a rotation changes height, not order</text>
  <text class="subtitle"    x="380" y="48">lift a child, fold the parent down — the in-order walk is untouched</text>

  <!-- ===== BEFORE: right-leaning stick 1 -> 2 -> 3 ===== -->
  <line class="edge" x1="140" y1="100" x2="200" y2="165"/>
  <line class="edge" x1="200" y1="165" x2="260" y2="230"/>
  <circle class="node-root" cx="140" cy="100" r="18"/><text class="node-label" x="140" y="105">1</text>
  <circle class="node" cx="200" cy="165" r="18"/><text class="node-label" x="200" y="170">2</text>
  <circle class="node" cx="260" cy="230" r="18"/><text class="node-label" x="260" y="235">3</text>
  <text class="state"   x="195" y="280">before — height 2</text>
  <text class="inorder" x="195" y="302">in-order: 1 → 2 → 3</text>

  <!-- ===== ARROW ===== -->
  <text class="op-label" x="380" y="158">rotate left</text>
  <text class="op-label" x="380" y="174">at 1</text>
  <path class="arrow-line" d="M 330 188 L 432 188"/>
  <polygon class="arrow-fill" points="432,182 444,188 432,194"/>

  <!-- ===== AFTER: 2 as root, children 1 and 3 ===== -->
  <line class="edge" x1="560" y1="120" x2="510" y2="195"/>
  <line class="edge" x1="560" y1="120" x2="610" y2="195"/>
  <circle class="node-root" cx="560" cy="120" r="18"/><text class="node-label" x="560" y="125">2</text>
  <circle class="node" cx="510" cy="195" r="18"/><text class="node-label" x="510" y="200">1</text>
  <circle class="node" cx="610" cy="195" r="18"/><text class="node-label" x="610" y="200">3</text>
  <text class="state"   x="560" y="280">after — height 1</text>
  <text class="inorder" x="560" y="302">in-order: 1 → 2 → 3</text>

  <text class="note-strong" x="380" y="332">same three nodes, same order — one level shorter. That is why a rotation can never break the tree.</text>
</svg>
