<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="bvs-title bvs-desc">
  <title id="bvs-title">Balanced tree vs. a degenerate stick — same seven values, different height</title>
  <desc id="bvs-desc">Two binary search trees built from the same values 1 through 7. On the left, a balanced tree rooted at 4, with 2 and 6 as its children and 1, 3, 5, 7 as leaves — height 2, every balance factor 0, any value found in at most 3 comparisons. On the right, the same values inserted in sorted order form a single right-leaning chain from 1 down to 7 — height 6, the root's balance factor minus 6, the last value 7 comparisons deep. Both obey the rule left-smaller-right-larger; only the height differs.</desc>
  <style>
    .panel       { fill: #f6efd5; stroke: #8b5a00; stroke-width: 0.8; opacity: 0.4; }
    .divider     { stroke: #8b5a00; stroke-width: 0.8; stroke-dasharray: 4 3; opacity: 0.55; fill: none; }
    .node        { fill: #f2e4bc; stroke: #8b5a00; stroke-width: 1.6; }
    .node-good   { fill: #e7efcf; stroke: #4a6b0f; stroke-width: 2.2; }
    .node-bad    { fill: #f4ddd2; stroke: #6b0f0f; stroke-width: 2.0; }
    .edge        { stroke: #8b5a00; stroke-width: 1.6; fill: none; }
    .edge-bad    { stroke: #6b0f0f; stroke-width: 1.8; fill: none; opacity: 0.8; }
    .node-label  { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #2a1a0a; font-weight: 700; text-anchor: middle; }
    .panel-title { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.10em; }
    .subtitle    { font-family: Georgia, serif; font-size: 11px; fill: #4a3a2a; font-style: italic; text-anchor: middle; }
    .zone-title  { font-family: Georgia, serif; font-size: 11px; fill: #8b5a00; font-style: italic; text-transform: uppercase; letter-spacing: 0.08em; text-anchor: middle; }
    .cap         { font-family: Georgia, serif; font-size: 11.5px; fill: #4a3a2a; text-anchor: middle; }
    .cap-good    { font-family: Georgia, serif; font-size: 11.5px; fill: #4a6b0f; font-weight: 700; text-anchor: middle; }
    .cap-bad     { font-family: Georgia, serif; font-size: 11.5px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
    .note-strong { font-family: Georgia, serif; font-size: 12px; fill: #6b0f0f; font-weight: 700; text-anchor: middle; }
  </style>

  <rect class="panel" x="10" y="10" width="740" height="420" rx="6"/>
  <text class="panel-title" x="380" y="30">balance is about height, not order</text>
  <text class="subtitle"    x="380" y="48">the same seven values, the same rule — two very different shapes</text>

  <line class="divider" x1="380" y1="64" x2="380" y2="410"/>
  <text class="zone-title" x="195" y="76">balanced</text>
  <text class="zone-title" x="565" y="76">sorted insert → a stick</text>

  <!-- ===== LEFT: balanced tree on 1..7, root 4 ===== -->
  <line class="edge" x1="195" y1="110" x2="120" y2="185"/>
  <line class="edge" x1="195" y1="110" x2="270" y2="185"/>
  <line class="edge" x1="120" y1="185" x2="85"  y2="258"/>
  <line class="edge" x1="120" y1="185" x2="155" y2="258"/>
  <line class="edge" x1="270" y1="185" x2="235" y2="258"/>
  <line class="edge" x1="270" y1="185" x2="305" y2="258"/>
  <circle class="node-good" cx="195" cy="110" r="16"/><text class="node-label" x="195" y="115">4</text>
  <circle class="node" cx="120" cy="185" r="16"/><text class="node-label" x="120" y="190">2</text>
  <circle class="node" cx="270" cy="185" r="16"/><text class="node-label" x="270" y="190">6</text>
  <circle class="node" cx="85"  cy="258" r="16"/><text class="node-label" x="85"  y="263">1</text>
  <circle class="node" cx="155" cy="258" r="16"/><text class="node-label" x="155" y="263">3</text>
  <circle class="node" cx="235" cy="258" r="16"/><text class="node-label" x="235" y="263">5</text>
  <circle class="node" cx="305" cy="258" r="16"/><text class="node-label" x="305" y="263">7</text>
  <text class="cap-good" x="195" y="312">height 2 — any name in ≤ 3 questions</text>
  <text class="cap"      x="195" y="330">every balance factor is 0</text>

  <!-- ===== RIGHT: sorted-insert stick 1→2→3→4→5→6→7 ===== -->
  <line class="edge-bad" x1="450" y1="92"  x2="494" y2="140"/>
  <line class="edge-bad" x1="494" y1="140" x2="538" y2="188"/>
  <line class="edge-bad" x1="538" y1="188" x2="582" y2="236"/>
  <line class="edge-bad" x1="582" y1="236" x2="626" y2="284"/>
  <line class="edge-bad" x1="626" y1="284" x2="670" y2="332"/>
  <line class="edge-bad" x1="670" y1="332" x2="713" y2="380"/>
  <circle class="node-bad" cx="450" cy="92"  r="15"/><text class="node-label" x="450" y="97">1</text>
  <circle class="node" cx="494" cy="140" r="15"/><text class="node-label" x="494" y="145">2</text>
  <circle class="node" cx="538" cy="188" r="15"/><text class="node-label" x="538" y="193">3</text>
  <circle class="node" cx="582" cy="236" r="15"/><text class="node-label" x="582" y="241">4</text>
  <circle class="node" cx="626" cy="284" r="15"/><text class="node-label" x="626" y="289">5</text>
  <circle class="node" cx="670" cy="332" r="15"/><text class="node-label" x="670" y="337">6</text>
  <circle class="node" cx="713" cy="380" r="15"/><text class="node-label" x="713" y="385">7</text>
  <text class="cap-bad" x="505" y="320">height 6 — find(7) takes 7 questions</text>
  <text class="cap"     x="505" y="338">root balance factor −6 (as lopsided as it gets)</text>

  <text class="note-strong" x="380" y="418">same values, same rule (left &lt; node &lt; right) — only the SHAPE differs, and shape is speed</text>
</svg>
