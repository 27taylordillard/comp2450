<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COMP-2450 — Data Structures &amp; Algorithms</title>

<!--
  =====================================================================
  COMP-2450 · DATA STRUCTURES & ALGORITHMS — Interactive Syllabus
  ---------------------------------------------------------------------
  Theme: dungeon crawler. Dark gold-on-slate, torch-lit, parchment.
  Everything you'll want to edit lives in ONE place: the CONFIG object
  near the bottom of this file (look for "===== CONFIG ====="). Change
  text there and the page rebuilds itself. No build step, no frameworks.
  =====================================================================
-->

<!-- Typefaces:
     Cinzel       -> display headings (Roman-inscription serif, fantasy feel)
     EB Garamond  -> body copy (old-tome parchment readability)
     JetBrains Mono -> data, labels, contact info, "code" texture -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
/* =====================================================================
   1. DESIGN TOKENS  (the whole palette + type system in one place)
   ===================================================================== */
:root{
  /* --- color: warm dungeon dark + antique gold + torch ember --- */
  --bg:        #14100b;   /* deep dungeon floor */
  --bg-2:      #1a140d;   /* slightly raised */
  --panel:     #1f1811;   /* panel base */
  --panel-2:   #271e14;   /* raised panel / hover */
  --ink:       #f3e7cf;   /* parchment cream (primary text) */
  --ink-dim:   #c3b48f;   /* dimmed parchment (secondary) */
  --ink-faint: #8c7d5f;   /* faint labels / eyebrows */
  --gold:      #d4af37;   /* primary gold */
  --gold-br:   #f0d27a;   /* bright gold highlight */
  --gold-deep: #8a6d1f;   /* shadowed gold (borders, rails) */
  --ember:     #c2502a;   /* danger / boss orange-red */
  --ember-br:  #e2783f;   /* bright ember */
  --crimson:   #9e3326;   /* final-boss deep red */
  --moss:      #7f9b53;   /* "unlocked" / success green */
  --line:      rgba(212,175,55,.22);  /* gold hairline */
  --line-soft: rgba(212,175,55,.11);  /* fainter hairline */

  /* --- shape & depth --- */
  --r:    14px;   /* panel radius */
  --r-sm: 9px;    /* small radius */
  --shadow: 0 18px 50px -22px rgba(0,0,0,.85);
  --glow-gold: 0 0 22px -2px rgba(212,175,55,.45);

  /* --- type --- */
  --display: "Cinzel", Georgia, serif;
  --body:    "EB Garamond", Georgia, serif;
  --mono:    "JetBrains Mono", ui-monospace, Menlo, monospace;
}

/* =====================================================================
   2. BASE / RESET
   ===================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:19px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* Layered torch-glow background painted onto the body */
body::before{
  content:"";
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(820px 540px at 50% -8%, rgba(212,175,55,.10), transparent 60%),
    radial-gradient(680px 480px at 12% 18%, rgba(194,80,42,.07), transparent 55%),
    radial-gradient(760px 600px at 92% 70%, rgba(212,175,55,.05), transparent 60%),
    linear-gradient(180deg, #16110b 0%, #110d08 60%, #0d0a06 100%);
}
/* Subtle stone-grain vignette */
body::after{
  content:"";
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  box-shadow: inset 0 0 240px 40px rgba(0,0,0,.65);
  opacity:.9;
}
a{ color:var(--gold-br); text-decoration:none; }
a:hover{ text-decoration:underline; text-underline-offset:3px; }
img{ max-width:100%; display:block; }
:focus-visible{
  outline:2px solid var(--gold-br);
  outline-offset:3px;
  border-radius:4px;
}

.wrap{ width:min(1080px, 92vw); margin-inline:auto; }

/* =====================================================================
   3. DEPTH BAR (scroll progress, styled as how deep you've descended)
   ===================================================================== */
.depthbar{
  position:fixed; top:0; left:0; height:3px; width:0%;
  z-index:60;
  background:linear-gradient(90deg, var(--gold-deep), var(--gold) 50%, var(--gold-br));
  box-shadow:0 0 12px rgba(212,175,55,.6);
  transition:width .08s linear;
}

/* =====================================================================
   4. TOP BAR / QUEST-LOG NAV
   ===================================================================== */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  padding:11px clamp(14px,4vw,40px);
  background:rgba(17,13,8,.78);
  backdrop-filter:blur(10px) saturate(1.1);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex; align-items:center; gap:11px;
  font-family:var(--display); font-weight:700; letter-spacing:.02em;
  color:var(--ink); font-size:.98rem;
}
.brand .ic{ width:20px; height:20px; color:var(--gold); }
.brand b{ color:var(--gold-br); font-weight:700; }
.brand small{
  font-family:var(--mono); font-size:.62rem; font-weight:500;
  letter-spacing:.16em; color:var(--ink-faint); text-transform:uppercase;
  margin-left:2px;
}
.qlog{ display:flex; flex-wrap:wrap; gap:2px 4px; }
.qlog a{
  font-family:var(--mono); font-size:.66rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-dim);
  padding:6px 9px; border-radius:7px; transition:.18s;
}
.qlog a:hover{ color:var(--bg); background:var(--gold); text-decoration:none; }

/* =====================================================================
   5. AMBIENT EMBERS (drifting torch sparks; disabled if reduced-motion)
   ===================================================================== */
.embers{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.ember{
  position:absolute; bottom:-12px; width:3px; height:3px; border-radius:50%;
  background:var(--ember-br); opacity:0;
  box-shadow:0 0 7px 1px rgba(226,120,63,.8);
  animation:rise linear infinite;
}
@keyframes rise{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  12%{ opacity:.9; }
  85%{ opacity:.55; }
  100%{ transform:translateY(-104vh) translateX(28px); opacity:0; }
}

/* main sits above ambient layers */
main{ position:relative; z-index:1; }

/* =====================================================================
   6. HERO — the dungeon entrance (the page's thesis)
   ===================================================================== */
.hero{ text-align:center; padding:clamp(64px,11vw,140px) 0 clamp(40px,7vw,80px); }
.hero .torch-row{ display:flex; justify-content:center; gap:60px; margin-bottom:26px; }
.hero .torch-row .ic{ width:30px; height:42px; color:var(--gold); filter:drop-shadow(0 0 14px rgba(226,120,63,.55)); animation:flicker 2.6s ease-in-out infinite; }
.hero .torch-row .ic:nth-child(2){ animation-delay:-1.1s; }
@keyframes flicker{ 0%,100%{opacity:1;transform:translateY(0)} 45%{opacity:.78;transform:translateY(-1px)} 70%{opacity:.92} }
.hero .kicker{
  font-family:var(--mono); font-size:.74rem; letter-spacing:.42em;
  text-transform:uppercase; color:var(--gold); margin-bottom:18px;
}
.hero h1{
  font-family:var(--display); font-weight:800;
  font-size:clamp(2.5rem,8.5vw,5.6rem); line-height:1.02; margin:0;
  letter-spacing:.01em;
  background:linear-gradient(176deg, #fff4d8 8%, var(--gold-br) 45%, var(--gold) 78%, var(--gold-deep) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 2px 40px rgba(212,175,55,.18);
}
.hero .course-code{
  font-family:var(--display); font-weight:600; letter-spacing:.18em;
  color:var(--ink-dim); font-size:clamp(1rem,3vw,1.4rem); margin:14px 0 0;
}
.hero .sub{
  max-width:640px; margin:22px auto 0; color:var(--ink-dim);
  font-size:clamp(1.06rem,2.4vw,1.32rem); font-style:italic;
}
.hero .chips{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:30px; }
.chip{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.08em;
  color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:999px; padding:7px 15px;
}
.enter-btn{
  display:inline-flex; align-items:center; gap:10px; margin-top:40px;
  font-family:var(--display); font-weight:600; letter-spacing:.08em;
  font-size:.95rem; color:var(--bg);
  background:linear-gradient(180deg, var(--gold-br), var(--gold));
  border:none; border-radius:999px; padding:14px 28px; cursor:pointer;
  box-shadow:var(--glow-gold); transition:.2s;
}
.enter-btn:hover{ transform:translateY(-2px); box-shadow:0 0 30px -2px rgba(212,175,55,.6); }
.enter-btn .ic{ width:18px; height:18px; }

/* =====================================================================
   7. FLOORS (sections) + headers + ornamental dividers
   ===================================================================== */
.floor{ padding:clamp(48px,8vw,86px) 0; }
.floor-head{ max-width:760px; margin:0 auto clamp(28px,4vw,44px); text-align:center; }
.eyebrow{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.3em;
  text-transform:uppercase; color:var(--gold);
  display:inline-flex; align-items:center; gap:9px;
}
.eyebrow .ic{ width:15px; height:15px; }
.floor-head h2{
  font-family:var(--display); font-weight:700;
  font-size:clamp(1.7rem,4.6vw,2.7rem); line-height:1.1;
  margin:.5rem 0 0; color:var(--ink);
}
.floor-head p.intro{ margin:.85rem auto 0; color:var(--ink-dim); max-width:620px; }

/* rune divider: ⟡ between two gold rules */
.rune-divider{ display:flex; align-items:center; justify-content:center; gap:16px; margin:46px auto; color:var(--gold-deep); }
.rune-divider::before,.rune-divider::after{ content:""; height:1px; width:min(120px,22vw); background:linear-gradient(90deg,transparent,var(--gold-deep)); }
.rune-divider::after{ background:linear-gradient(90deg,var(--gold-deep),transparent); }
.rune-divider span{ color:var(--gold); font-size:1.1rem; }

/* generic panel (old-tome card with a faint inner border) */
.panel{
  position:relative; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow);
}
.panel::after{
  content:""; position:absolute; inset:6px; border:1px solid var(--line-soft);
  border-radius:calc(var(--r) - 6px); pointer-events:none;
}

/* =====================================================================
   8. QUEST (course description)
   ===================================================================== */
.quest-panel{ padding:clamp(26px,5vw,46px); }
.quest-panel p{ margin:0; font-size:1.14rem; }
.quest-panel .drop::first-letter{
  font-family:var(--display); font-weight:800; font-size:3.4em;
  float:left; line-height:.74; padding:6px 12px 0 0; color:var(--gold);
}

/* =====================================================================
   9. PROVISIONS (materials + prerequisites)
   ===================================================================== */
.prov-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:22px; }
.prov-card{ padding:clamp(22px,3vw,30px); }
.prov-card h3{ font-family:var(--display); font-weight:600; font-size:1.05rem; letter-spacing:.04em; color:var(--gold-br); margin:0 0 18px; display:flex; align-items:center; gap:10px; }
.prov-card h3 .ic{ width:18px; height:18px; color:var(--gold); }
.gear-item{ display:flex; gap:14px; padding:13px 0; border-top:1px solid var(--line-soft); }
.gear-item:first-of-type{ border-top:none; }
.gear-item .ic{ width:22px; height:22px; color:var(--gold); flex:none; margin-top:3px; }
.gear-item b{ font-family:var(--body); font-weight:600; color:var(--ink); display:block; font-size:1.05rem; }
.gear-item span{ color:var(--ink-dim); font-size:.95rem; }
.prereq-list{ display:flex; flex-wrap:wrap; gap:9px; margin-top:6px; }
.prereq{ font-family:var(--mono); font-size:.74rem; letter-spacing:.03em; color:var(--ink-dim); background:var(--bg-2); border:1px solid var(--line-soft); border-radius:7px; padding:7px 11px; }
.prov-note{ color:var(--ink-faint); font-style:italic; font-size:.96rem; margin-top:16px; }

/* =====================================================================
   10. SKILL TREE  (THE SIGNATURE — torch path of learning outcomes)
   ===================================================================== */
.tree-meta{ text-align:center; font-family:var(--mono); font-size:.82rem; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:30px; }
.tree-meta b{ color:var(--gold-br); font-size:1.05rem; }
.path{ position:relative; max-width:760px; margin-inline:auto; }
/* the descending path line */
.path::before{
  content:""; position:absolute; left:27px; top:14px; bottom:14px; width:2px;
  background:linear-gradient(180deg, var(--gold-deep), rgba(138,109,31,.25));
}
.tnode{ display:grid; grid-template-columns:54px 1fr; gap:0 16px; margin-bottom:14px; }
.railcell{ position:relative; }
.dot{
  position:relative; width:40px; height:40px; margin:0 auto;
  display:grid; place-items:center; border-radius:50%;
  background:var(--bg-2); border:2px solid var(--gold-deep);
  z-index:1; transition:.3s;
}
.dot .ic{ width:20px; height:24px; color:var(--ink-faint); transition:.3s; }
.card-btn{
  width:100%; text-align:left; cursor:pointer; color:inherit;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:15px 18px; transition:.22s; font-family:inherit;
}
.card-btn:hover{ background:var(--panel-2); border-color:var(--gold-deep); transform:translateX(3px); }
.card-head{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.card-head .num{ font-family:var(--mono); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
.card-head .ttl{ font-family:var(--display); font-weight:600; font-size:1.16rem; color:var(--ink); }
.card-head .lockword{ margin-left:auto; font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }
.card-body{ max-height:0; overflow:hidden; transition:max-height .35s ease, margin .35s ease, opacity .3s; opacity:0; }
.card-body p{ margin:12px 0 2px; color:var(--ink-dim); font-size:1.04rem; }
/* unlocked state */
.tnode.lit .dot{ background:radial-gradient(circle at 50% 35%, #4a3410, #1a1308); border-color:var(--gold); box-shadow:var(--glow-gold), 0 0 28px -4px rgba(226,120,63,.6); }
.tnode.lit .dot .ic{ color:var(--gold-br); filter:drop-shadow(0 0 6px rgba(226,120,63,.8)); animation:flicker 2.4s ease-in-out infinite; }
.tnode.lit .card-btn{ border-color:var(--gold); }
.tnode.lit .card-head .ttl{ color:var(--gold-br); }
.tnode.lit .card-head .lockword{ color:var(--moss); }
.tnode.lit .card-body{ max-height:240px; opacity:1; }
.tree-done{
  margin:30px auto 0; max-width:520px; text-align:center;
  font-family:var(--display); font-weight:600; letter-spacing:.04em; color:var(--moss);
  background:rgba(127,155,83,.08); border:1px solid rgba(127,155,83,.35);
  border-radius:var(--r-sm); padding:16px 20px;
}

/* =====================================================================
   11. LOOT & XP (grading donut + legend)
   ===================================================================== */
.loot-grid{ display:grid; grid-template-columns:300px 1fr; gap:clamp(24px,5vw,56px); align-items:center; }
.donut-wrap{ position:relative; width:300px; height:300px; margin:0 auto; }
.donut-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.donut-seg{ fill:none; stroke-width:34; stroke-linecap:butt; transition:stroke-dasharray 1s cubic-bezier(.2,.7,.2,1), stroke-width .2s, opacity .2s; cursor:pointer; }
.donut-center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none; }
.donut-center .big{ font-family:var(--display); font-weight:800; font-size:2.7rem; line-height:1; color:var(--gold-br); }
.donut-center .lab{ font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); margin-top:8px; max-width:160px; }
.legend{ display:flex; flex-direction:column; gap:4px; }
.legend-row{
  display:grid; grid-template-columns:16px 1fr auto; align-items:center; gap:14px;
  padding:13px 14px; border-radius:var(--r-sm); cursor:pointer;
  border:1px solid transparent; transition:.18s;
}
.legend-row:hover,.legend-row.active{ background:var(--panel); border-color:var(--line); }
.legend-row .swatch{ width:15px; height:15px; border-radius:4px; }
.legend-row .name{ font-family:var(--body); font-weight:600; font-size:1.08rem; color:var(--ink); }
.legend-row .name small{ display:block; font-family:var(--mono); font-weight:400; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-top:2px; }
.legend-row .wt{ font-family:var(--display); font-weight:700; font-size:1.35rem; color:var(--gold-br); }

/* =====================================================================
   12. BOSS FIGHTS (exams)
   ===================================================================== */
/* three wardens across the top, the final descent spanning beneath them */
.boss-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.boss{ padding:22px 22px 20px; transition:.22s; }
.boss:hover{ transform:translateY(-3px); border-color:var(--ember); }
.boss-top{ display:flex; align-items:center; gap:13px; margin-bottom:14px; }
.boss-sigil{ width:46px; height:46px; flex:none; display:grid; place-items:center; border-radius:10px; background:rgba(194,80,42,.1); border:1px solid rgba(194,80,42,.4); }
.boss-sigil .ic{ width:26px; height:26px; color:var(--ember-br); }
.boss .numeral{ font-family:var(--mono); font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--ember-br); }
.boss h3{ font-family:var(--display); font-weight:700; font-size:1.22rem; margin:2px 0 0; color:var(--ink); }
.boss .tests{ color:var(--ink-dim); font-size:1rem; margin:0 0 14px; }
.hpbar{ height:7px; border-radius:6px; background:var(--bg-2); border:1px solid var(--line-soft); overflow:hidden; }
.hpbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--ember),var(--ember-br)); width:0; transition:width 1.1s ease; }
.hplabel{ font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin-top:7px; }
/* final boss spans the row and goes crimson */
.boss.final{ grid-column:1 / -1; background:linear-gradient(180deg, #241310, var(--panel)); border-color:var(--crimson); }
.boss.final .boss-sigil{ background:rgba(158,51,38,.18); border-color:rgba(158,51,38,.55); }
.boss.final .boss-sigil .ic, .boss.final .numeral{ color:#e07a55; }
.boss.final .hpbar i{ background:linear-gradient(90deg,var(--crimson),var(--ember-br)); }
.boss-note{ text-align:center; color:var(--ink-faint); font-style:italic; font-size:.97rem; margin-top:22px; }

/* =====================================================================
   13. THE ARMORY (data structures)
   ===================================================================== */
.armory-label{ font-family:var(--mono); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:6px 0 14px; display:flex; align-items:center; gap:10px; }
.armory-label::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
.inv-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px; }
.inv-tile{
  display:flex; flex-direction:column; align-items:center; gap:9px;
  padding:18px 10px; cursor:pointer; text-align:center;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm);
  transition:.18s; font-family:inherit; color:inherit;
}
.inv-tile:hover{ background:var(--panel-2); border-color:var(--gold); transform:translateY(-2px); }
.inv-tile.sel{ border-color:var(--gold); box-shadow:var(--glow-gold); }
.inv-tile .slot{ width:46px; height:46px; display:grid; place-items:center; border-radius:9px; background:var(--bg-2); border:1px solid var(--line-soft); }
.inv-tile .slot .ic{ width:26px; height:26px; color:var(--gold); }
.inv-tile .nm{ font-family:var(--body); font-weight:600; font-size:.96rem; color:var(--ink); line-height:1.2; }
.inv-stl .slot .ic{ color:var(--ink-dim); }
/* "surveyed" gear — named in the course but never built; dimmest of the three tiers */
.inv-surveyed .slot .ic{ color:var(--ink-faint); }
.inv-surveyed .nm{ color:var(--ink-dim); }
/* the "examine" readout panel */
.examine{ padding:18px 22px; display:flex; gap:16px; align-items:center; min-height:74px; }
.examine .slot{ width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:10px; background:var(--bg-2); border:1px solid var(--line); }
.examine .slot .ic{ width:28px; height:28px; color:var(--gold); }
.examine .txt b{ font-family:var(--display); font-weight:600; color:var(--gold-br); font-size:1.12rem; }
.examine .txt p{ margin:3px 0 0; color:var(--ink-dim); font-size:1.02rem; }
.examine.empty .txt b{ color:var(--ink-faint); font-family:var(--body); font-style:italic; font-weight:500; }
.techniques{ text-align:center; color:var(--ink-dim); font-size:1.04rem; margin-top:24px; }
.techniques b{ color:var(--gold-br); font-family:var(--display); font-weight:600; }

/* =====================================================================
   14. FLOOR PLAN (schedule)
   ===================================================================== */
.map-card{ padding:clamp(26px,4vw,40px); display:grid; grid-template-columns:1fr auto; gap:30px; align-items:center; }
.map-card .map-text h3{ font-family:var(--display); font-weight:600; font-size:1.3rem; color:var(--ink); margin:0 0 10px; }
.map-card .map-text p{ color:var(--ink-dim); margin:0 0 18px; }
.map-meta{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
.map-meta .chip .ic{ width:13px; height:13px; vertical-align:-2px; margin-right:6px; color:var(--gold); }
.map-svg{ width:170px; height:170px; color:var(--gold-deep); flex:none; }
.map-svg .lit{ fill:rgba(212,175,55,.12); stroke:var(--gold); }

/* =====================================================================
   15. YOUR GUIDE (NPC contact card — mirrors the screenshot)
   ===================================================================== */
.npc{ padding:clamp(24px,4vw,40px); display:grid; grid-template-columns:230px 1fr; gap:clamp(22px,4vw,40px); }
.npc .portrait{ width:230px; }
.npc .portrait img{ border-radius:var(--r); border:1px solid var(--gold-deep); box-shadow:var(--shadow); }
.npc .door{ font-family:var(--display); font-weight:600; font-size:.8rem; letter-spacing:.04em; text-align:center; margin-top:14px; color:var(--ink-dim); }
.npc .door b{ color:var(--gold); font-style:italic; }
.npc h3{ font-family:var(--display); font-weight:700; font-size:1.9rem; margin:0; color:var(--ink); }
.npc .role{ font-style:italic; color:var(--ink-dim); margin:4px 0 22px; }
.contact{ display:grid; grid-template-columns:88px 1fr; gap:11px 14px; margin-bottom:26px; }
.contact dt{ font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); align-self:center; }
.contact dd{ margin:0; font-family:var(--mono); font-size:.95rem; color:var(--gold-br); }
.contact dd a{ color:var(--gold-br); }
.oh-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.oh-head h4{ font-family:var(--display); font-weight:600; font-size:1.1rem; margin:0; color:var(--ink); }
.oh-legend{ display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
.oh-legend .sw{ width:13px; height:13px; border-radius:3px; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); box-shadow:var(--glow-gold); }
/* office-hours grid */
.oh-grid{ display:grid; grid-template-columns:auto repeat(5,1fr); gap:7px; }
.oh-grid .cell{ min-height:34px; }
.oh-grid .day{ font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); text-align:center; align-self:center; }
.oh-grid .time{ font-family:var(--mono); font-size:.6rem; color:var(--ink-faint); align-self:center; padding-right:6px; white-space:nowrap; }
.oh-grid .slot{ border:1px solid var(--line-soft); border-radius:7px; background:rgba(255,255,255,.012); }
.oh-grid .slot.on{ background:linear-gradient(180deg, rgba(212,175,55,.32), rgba(138,109,31,.18)); border-color:var(--gold); box-shadow:inset 0 0 12px -4px rgba(212,175,55,.5); }
.oh-note{ color:var(--ink-faint); font-style:italic; font-size:.92rem; margin-top:16px; }
.npc .closer{ color:var(--ink-dim); font-style:italic; font-size:1rem; margin-top:18px; border-top:1px solid var(--line-soft); padding-top:16px; }
/* "Schedule a Meeting" button — a lit doorway out of the office-hours grid.
   Gold gradient on dark ink so it reads as the card's primary call to action. */
.book-btn{
  display:inline-flex; align-items:center; gap:9px; margin-top:18px;
  font-family:var(--display); font-weight:600; font-size:.86rem;
  letter-spacing:.08em; text-transform:uppercase; color:var(--bg);
  background:linear-gradient(180deg, var(--gold-br), var(--gold));
  border:1px solid var(--gold-deep); border-radius:999px; padding:12px 22px;
  box-shadow:var(--glow-gold); transition:transform .18s, box-shadow .18s, filter .18s;
}
.book-btn:hover{ filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 6px 20px rgba(212,175,55,.4); text-decoration:none; }
.book-btn .ic{ width:16px; height:16px; color:var(--bg); }

/* =====================================================================
   16. CODE OF THE DUNGEON (policies as unrollable scrolls)
   ===================================================================== */
.scrolls{ max-width:820px; margin-inline:auto; display:flex; flex-direction:column; gap:11px; }
.scroll{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; }
.scroll[open]{ border-color:var(--gold-deep); }
.scroll summary{
  list-style:none; cursor:pointer; padding:16px 20px;
  display:flex; align-items:center; gap:13px;
  font-family:var(--display); font-weight:600; font-size:1.1rem; color:var(--ink);
}
.scroll summary::-webkit-details-marker{ display:none; }
.scroll summary .ic{ width:19px; height:19px; color:var(--gold); flex:none; }
.scroll summary .chev{ margin-left:auto; color:var(--gold); transition:transform .25s; font-family:var(--mono); }
.scroll[open] summary .chev{ transform:rotate(90deg); }
.scroll .scroll-body{ padding:0 20px 20px 52px; color:var(--ink-dim); font-size:1.04rem; }
.scroll .scroll-body p{ margin:0 0 .8em; }
.scroll .scroll-body p:last-child{ margin-bottom:0; }
.scroll .scroll-body ul{ margin:.2em 0 .8em; padding-left:1.1em; }
.scroll .scroll-body li{ margin-bottom:.3em; }
.scroll .scroll-body b{ color:var(--ink); }
.scroll[open] summary .ttl{ color:var(--gold-br); }

/* =====================================================================
   17. FOOTER + dice easter egg
   ===================================================================== */
.foot{ position:relative; z-index:1; border-top:1px solid var(--line); margin-top:40px; padding:46px 0 60px; text-align:center; }
.foot .flavor{ font-family:var(--display); font-style:italic; color:var(--ink-dim); font-size:1.15rem; max-width:560px; margin:0 auto 26px; }
.dice-btn{
  display:inline-flex; align-items:center; gap:10px;
  font-family:var(--mono); font-size:.74rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-br); background:var(--panel); border:1px solid var(--gold-deep);
  border-radius:999px; padding:11px 20px; cursor:pointer; transition:.18s;
}
.dice-btn:hover{ background:var(--panel-2); border-color:var(--gold); }
.dice-btn .ic{ width:18px; height:18px; }
.dice-result{ margin-top:18px; min-height:24px; font-family:var(--body); font-style:italic; color:var(--ink-dim); }
.dice-result b{ color:var(--gold-br); font-style:normal; }
.foot .colophon{ margin-top:34px; font-family:var(--mono); font-size:.64rem; letter-spacing:.1em; color:var(--ink-faint); }

/* =====================================================================
   18. SCROLL-REVEAL animation
   ===================================================================== */
.reveal{ opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s ease; }
.reveal.in{ opacity:1; transform:none; }

/* =====================================================================
   19. RESPONSIVE
   ===================================================================== */
@media (max-width:880px){
  .prov-grid,.loot-grid,.map-card,.npc{ grid-template-columns:1fr; }
  .inv-grid{ grid-template-columns:repeat(2,1fr); }
  .boss-grid{ grid-template-columns:1fr; }
  .donut-wrap{ width:260px; height:260px; }
  .npc .portrait{ width:200px; margin-inline:auto; }
  .map-svg{ margin-inline:auto; }
}
@media (max-width:520px){
  body{ font-size:18px; }
  .inv-grid{ grid-template-columns:repeat(2,1fr); }
  .boss-grid{ grid-template-columns:1fr; }
  .contact{ grid-template-columns:1fr; gap:3px 0; }
  .contact dt{ margin-top:10px; }
  .hero .torch-row{ gap:44px; }
}

/* =====================================================================
   20. ACCESSIBILITY — respect reduced motion
   ===================================================================== */
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  .reveal{ opacity:1; transform:none; }
}

    /* --- THE CODE OF THE DUNGEON (policies as unrollable scrolls) --- */
    code: {
      eyebrow: "The Code of the Dungeon", icon: "ic-scroll", title: "Rules of the Realm",
      intro: "The fine print — attendance, integrity, accommodations, and more. Tap a scroll to unroll it.",
      policies: [
        { title:"How Class Runs", body:"Each floor's lecture is <b>pre-recorded</b>. Watch it and do the assigned ZyBook reading <em>before</em> you arrive. Class time is not for re-reading the textbook to you — it is for writing code together, sometimes as a whole room, sometimes in pairs or small groups. Come having met the material once, and you will leave having used it." },
        { title:"Grading Scale", body:"Your final grade is the weighted total shown in <b>Loot &amp; XP</b>, on the standard letter scale: <b>A</b> 90–100, <b>B</b> 80–89, <b>C</b> 70–79, <b>D</b> 60–69, <b>F</b> below 60. Individual assignments may be worth different rubric point totals, but every score is normalized to a 100-point scale in Canvas, and your course grade is weighted by the assignment categories in <b>Loot &amp; XP</b> rather than by raw points. Grades are straight letters — there is no plus or minus. There is no extra credit — the points on that table are all the points there are. The one exception runs the other way: see <b>The ZyBook Pact</b> below." },
        { title:"Attendance &amp; Professionalism", body:"Attendance is required, and it is graded — it is the largest part of the 5% <b>Professionalism</b> component, along with arriving on time, taking part in the in-class programming, and carrying your share of pair and group work. You are allowed <b>three unexcused absences</b> in this 3-credit-hour class; each additional unexcused absence reduces your professionalism grade. If you have to miss for illness, a university-sponsored activity, or an emergency, email me — ahead of time when you can." },
        { title:"Late Work", body:"<p><b>Assignments</b> are accepted up to two days past the deadline at a 20% penalty. Work submitted more than two days late is not accepted without prior arrangement.</p><p><b>ZyBook activities and exams are different</b> — the two-day window does not apply to them. Due dates for the participation and challenge activities are posted in Canvas. If something is going to keep you from one of those deadlines or from an exam, email me and we will see what can be extended. Ask before the deadline, not after.</p><p><b>The zyLabs have no weekly deadline at all</b> — they run to the last day of class. See <b>The ZyBook Pact</b>.</p>" },
        { title:"Missed Exams", body:"If you miss a warden fight or the Final Descent, email me to schedule a makeup. Do it as early as you can — and if you already know you will be away, email me <em>before</em> the exam rather than after it." },
        { title:"Submitting Work", body:"All labs, project milestones, and take-home warden work are submitted through <b>Canvas</b>. Everything you do inside the ZyBook — participation activities, challenge activities, and the zyLabs — is completed and scored there automatically, so there is nothing to submit for any of it." },
        { title:"Collaboration &amp; Pair Work", body:"<p><b>Labs and the semester project may be done in pairs.</b> If you pair up, put both names on the submission, and be sure both of you can explain every line you turn in.</p><p><b>ZyBook work is individual work, always</b> — and the zyLabs especially, since doing them on your own is the whole condition of the ZyBook Pact below. <b>Warden fights and the Final Descent are individual work.</b></p><p>When you are not sure whether a particular collaboration is allowed, ask me before you do it rather than after.</p>" },
        { title:"The ZyBook Pact", body:"<p>Finish the ZyBook's labs on your own, and you never have to sit the final.</p><p>Precisely: complete <b>every zyLab in the ZyBook to 100%</b>, working individually, at any point before the last day of class. Do that and your <b>Final Descent is recorded as 100%</b>, and sitting the exam becomes optional.</p><p><b>The zyLabs are yours to schedule.</b> They are not on the Canvas due-date calendar, and you are not held to the week we cover their chapter — work them on your own time, at whatever pace suits you, so long as every one of them stands at 100% before the last day of class. zyLabs check your code automatically, allow unlimited attempts, and are scored purely on <b>completion</b> — a zyLab is either finished or it is not. Reaching 100% asks for persistence, not brilliance.</p><p>Completion is read straight from the ZyBook report, so there is nothing to submit and nothing to ask me for.</p><p><b>Working them with anyone else forfeits the Pact.</b> This is the one piece of work in the course with no pair option, and the reason is simple — it stands in for an exam you would have sat alone.</p><p><b>Skipping them costs you nothing but the Pact.</b> They are completion-based, not a graded assignment, and they carry no weight in any category. Leave them undone and you simply sit the Final Descent alongside everyone else, for the 15% it is worth. The participation and challenge activities are a separate matter entirely: they carry their own 10% (see <b>Loot &amp; XP</b>), and they are graded that way whether or not you go after the Pact.</p><p>The offer is deliberately generous, and the reasoning is simple: a student who has worked every zyLab alone, all the way to 100%, has already written more code than the final was ever going to ask for.</p>" },
        { title:"Academic Integrity", body:"Cheating in all its forms is inconsistent with Christian faith and practice and will result in sanctions up to and including dismissal from the class with a failing grade." },
        { title:"Generative AI", body:"In this course, generative AI tools may be used for background reading and concept research with appropriate acknowledgment and citation, but not for any graded code. Contact your instructor if you are in doubt as to whether you are using generative AI tools appropriately in this course. You are responsible for checking facts, finding reliable sources, citing appropriately, and making a careful, critical examination of any work that you submit. Failure to acknowledge and cite the generative AI or using generative AI on assignments not approved for AI use is academically dishonest and constitutes a violation of Harding's Academic Integrity Policy." },
        { title:"Student Privacy &amp; Class Recordings", body:"<p>This course may involve audio/video recording of class sessions for educational purposes. By enrolling in this course, students consent to being recorded during class sessions, including their voice and image, when participating in class discussions or activities.</p><p><b>Student rights regarding recordings:</b></p><ul><li>Students have the right to review recordings in which they appear.</li><li>Recordings are considered educational records protected under FERPA.</li><li>Students may request accommodation if they have concerns about being recorded.</li><li>Recordings may not be shared, distributed, or posted by students without explicit written permission.</li></ul><p><b>Use of recordings.</b> Class recordings are for educational use only and may be used for students who missed class due to illness or emergency; student review of course material; accommodation purposes for students with documented disabilities; instructor review and course improvement; and, with student consent, in other sections or future offerings of the course.</p><p><b>Retention.</b> Recordings will be retained for 7 years and then permanently deleted unless required for disciplinary or legal proceedings.</p><p><b>Student-initiated recordings.</b> Students may not record class sessions without prior written consent from the instructor and all participants. Unauthorized recording may result in disciplinary action.</p>" },
        { title:"Students with Disabilities", body:"It is the policy for Harding University to accommodate students with disabilities, pursuant to federal and state law. Therefore, any student with a documented disability condition (e.g. physical, learning, or psychological) who needs to arrange reasonable accommodations must contact the instructor and the Office of Disability Services and Educational Access at the beginning of each semester. If the diagnosis of the disability occurs during the academic year, the student must self-identify with the Office of Disability Services and Educational Access as soon as possible in order to get academic accommodations in place for the remainder of the semester. The Office of Disability Services and Educational Access is located in Room 239 in the Student Center, telephone (501) 279-4019." },
        { title:"Time Expectations", body:"For every hour in class, the typical student should expect to spend at least two clock hours on course-related work, including but not limited to out-of-class time spent reading, problem solving, reviewing, organizing notes, preparing for upcoming quizzes/exams and other activities that enhance learning." },
        { title:"Dress Code", body:"All students must abide by the Student Handbook. A student may be asked to leave class or other activities if they are not in keeping with these standards." },
        { title:"Assessment", body:"Harding University, since its charter in 1924, has been strongly committed to providing the best resources and environment for the teaching-learning process. The board, administration, faculty, and staff are wholeheartedly committed to full compliance with all Criteria of Accreditation of the Higher Learning Commission as well as the standards of many discipline-specific specialty accrediting agencies. The university values continuous, rigorous assessment at every level for its potential to improve student learning and achievement and for its centrality in fulfilling the stated mission of Harding. Thus, a comprehensive assessment program has been developed that includes both the academic units and the administrative and educational support units. Course-specific student learning outcomes contribute to student achievement of program-specific learning outcomes that support student achievement of holistic university learning outcomes. All academic units design annual assessment plans centered on measuring student achievement of program learning outcomes used to sequentially improve teaching and learning processes. Additionally, a holistic assessment of student achievement of university learning outcomes is coordinated by the university Director of Assessment and Testing used to spur continuous improvement of teaching and learning." }
      ]
    },

  /* ===================================================================
     RENDER: SKILL TREE  (signature interaction)
     Each node is a button. Clicking toggles ".lit" on its <li>, which the
     CSS uses to light the torch and slide the description open. A counter
     tracks progress; lighting all of them reveals a final banner.
     =================================================================== */
  function renderSkills(){
    const s = CONFIG.skills;
    const nodes = s.nodes.map((n,i) => `
      <li class="tnode" data-i="${i}">
        <div class="railcell"><span class="dot">${icon("ic-torch")}</span></div>
        <button class="card-btn" aria-expanded="false">
          <div class="card-head">
            <span class="num">Ability ${i+1}</span>
            <span class="ttl">${n.title}</span>
            <span class="lockword">Locked</span>
          </div>
          <div class="card-body"><p>${n.full}</p></div>
        </button>
      </li>`).join("");

    $("#skills").innerHTML = head(s) + `
      <div class="tree-meta"><b id="skillcount">0</b> / ${s.nodes.length} abilities mastered</div>
      <ol class="path" style="list-style:none;padding:0;margin:0">${nodes}</ol>
      <div class="tree-done" id="treedone" hidden>${s.done}</div>`;

    // Wire up the click-to-light behavior.
    const total = s.nodes.length;
    $("#skills").querySelectorAll(".tnode").forEach(node => {
      const btn = node.querySelector(".card-btn");
      btn.addEventListener("click", () => {
        const lit = node.classList.toggle("lit");
        btn.setAttribute("aria-expanded", lit ? "true" : "false");
        node.querySelector(".lockword").textContent = lit ? "Mastered" : "Locked";
        // Recount how many are lit and update the meter + final banner.
        const count = $("#skills").querySelectorAll(".tnode.lit").length;
        $("#skillcount").textContent = count;
        $("#treedone").hidden = (count !== total);
      });
    });
  }

  /* ===================================================================
     RENDER: LOOT & XP (animated SVG donut + interactive legend)
     The donut is drawn with one <circle> per grade component. We turn each
     weight into an arc length using stroke-dasharray, and offset each arc
     so they sit end-to-end around the ring. Pure SVG — no chart library.
     =================================================================== */
  function renderLoot(){
    const L = CONFIG.loot;
    const R = 80;                       // ring radius
    const C = 2 * Math.PI * R;          // circumference = total "track" length
    const cx = 100, cy = 100;           // center of a 200x200 viewBox

    // Build one circle per slice. We START every arc at length 0 so we can
    // animate them growing to their real length once scrolled into view.
    let offset = 0;
    const segs = L.items.map((it, i) => {
      const len = (it.weight / 100) * C;     // this slice's arc length
      const dashFull = `${len} ${C - len}`;  // [drawn, gap]
      const thisOffset = offset;             // where this slice begins
      offset -= len;                         // next slice starts after it
      return { ...it, len, dashFull, dashOffset: thisOffset, i };
    });

    const circles = segs.map(s => `
      <circle class="donut-seg" data-i="${s.i}"
        cx="${cx}" cy="${cy}" r="${R}"
        stroke="var(${s.color})"
        stroke-dasharray="0 ${C}"
        stroke-dashoffset="${s.dashOffset}"
        data-dash="${s.dashFull}"></circle>`).join("");

    const rows = L.items.map((it,i) => `
      <div class="legend-row" data-i="${i}" tabindex="0" role="button">
        <span class="swatch" style="background:var(${it.color})"></span>
        <span class="name">${it.name}<small>${it.sub}</small></span>
        <span class="wt">${it.weight}%</span>
      </div>`).join("");

    $("#loot").innerHTML = head(L) + `
      <div class="loot-grid">
        <div class="donut-wrap">
          <svg viewBox="0 0 200 200" id="donut">${circles}</svg>
          <div class="donut-center">
            <div class="big" id="donutBig">100%</div>
            <div class="lab" id="donutLab">of your final grade</div>
          </div>
        </div>
        <div class="legend" id="legend">${rows}</div>
      </div>`;

    // --- interactivity: hover/focus a legend row OR a wedge to inspect it ---
    const allSegs = $("#loot").querySelectorAll(".donut-seg");
    const allRows = $("#loot").querySelectorAll(".legend-row");
    const big = $("#donutBig"), lab = $("#donutLab");

    function focusSlice(i){
      allSegs.forEach(s => { const on = +s.dataset.i === i; s.style.strokeWidth = on ? "40" : "28"; s.style.opacity = on ? "1" : ".4"; });
      allRows.forEach(r => r.classList.toggle("active", +r.dataset.i === i));
      const it = L.items[i];
      big.textContent = it.weight + "%";
      lab.innerHTML = it.name;
    }
    function resetSlices(){
      allSegs.forEach(s => { s.style.strokeWidth = "34"; s.style.opacity = "1"; });
      allRows.forEach(r => r.classList.remove("active"));
      big.textContent = "100%"; lab.textContent = "of your final grade";
    }
    [...allSegs, ...allRows].forEach(el => {
      const i = +el.dataset.i;
      el.addEventListener("mouseenter", () => focusSlice(i));
      el.addEventListener("focus", () => focusSlice(i));
      el.addEventListener("mouseleave", resetSlices);
      el.addEventListener("blur", resetSlices);
    });

    // --- animate the wedges drawing themselves when first scrolled into view ---
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if(e.isIntersecting){
          allSegs.forEach(s => s.setAttribute("stroke-dasharray", s.dataset.dash));
          io.disconnect();
        }
      });
    }, { threshold:0.4 });
    io.observe($("#donut"));
  }

  /* ===================================================================
     RENDER: BOSS FIGHTS (exams)
     =================================================================== */
  function renderBosses(){
    const b = CONFIG.bosses;
    const card = (x, isFinal=false) => `
      <div class="boss${isFinal ? " final" : ""} panel">
        <div class="boss-top">
          <div class="boss-sigil">${icon("ic-skull")}</div>
          <div>
            <div class="numeral">${x.numeral}</div>
            <h3>${x.name}</h3>
          </div>
        </div>
        <p class="tests">${x.tests}</p>
        <div class="hpbar"><i data-hp="${x.hp}"></i></div>
        <div class="hplabel">Threat level</div>
      </div>`;

    $("#bosses").innerHTML = head(b) +
      `<div class="boss-grid">
         ${b.list.map(x => card(x)).join("")}
         ${card(b.final, true)}
       </div>
       <p class="boss-note">${b.note}</p>`;

    // Fill the HP bars when scrolled into view.
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if(e.isIntersecting){
          $("#bosses").querySelectorAll(".hpbar i").forEach(i => i.style.width = i.dataset.hp + "%");
          io.disconnect();
        }
      });
    }, { threshold:0.25 });
    io.observe($("#bosses"));
  }

  /* ===================================================================
     RENDER: THE ARMORY (data structures)
     Clicking a tile shows its description in a shared "examine" readout.
     =================================================================== */
  function renderArmory(){
    const a = CONFIG.armory;
    const tile = (it, group) => `
      <button class="inv-tile ${group}" data-name="${it.name}" data-desc="${it.desc}" data-icon="${it.icon}">
        <span class="slot">${icon(it.icon)}</span>
        <span class="nm">${it.name}</span>
      </button>`;

    $("#armory").innerHTML = head(a) + `
      <div class="armory-label">${icon("ic-sword")} Forged by hand · from scratch</div>
      <div class="inv-grid">${a.forged.map(it => tile(it,"inv-forged")).join("")}</div>

      <div class="armory-label">${icon("ic-box")} Standard-issue gear · the C++ STL</div>
      <div class="inv-grid inv-stl">${a.stl.map(it => tile(it,"inv-stl")).join("")}</div>

      <div class="armory-label">${icon("ic-torch")} Surveyed, not forged · named but never built</div>
      <div class="inv-grid inv-surveyed">${a.surveyed.map(it => tile(it,"inv-surveyed")).join("")}</div>

      <div class="panel examine empty" id="examine">
        <span class="slot">${icon("ic-key")}</span>
        <div class="txt"><b>Tap any item to inspect it.</b><p></p></div>
      </div>

      <p class="techniques">${a.techniques}</p>`;

    const ex = $("#examine");
    $("#armory").querySelectorAll(".inv-tile").forEach(tileEl => {
      tileEl.addEventListener("click", () => {
        // visually mark the selected tile
        $("#armory").querySelectorAll(".inv-tile").forEach(t => t.classList.remove("sel"));
        tileEl.classList.add("sel");
        // update the readout
        ex.classList.remove("empty");
        ex.querySelector(".slot").innerHTML = icon(tileEl.dataset.icon);
        ex.querySelector("b").textContent = tileEl.dataset.name;
        ex.querySelector("p").innerHTML = tileEl.dataset.desc;
      });
    });
  }

  /* ===================================================================
     RENDER: YOUR GUIDE (instructor NPC card + office-hours grid)
     =================================================================== */
  function renderGuide(){
    const g = CONFIG.guide, oh = g.officeHours;
    const days = Object.keys(oh.byDay);   // ["Mon","Tue",...]

    // Build the office-hours grid as a sequence of cells, row by row.
    // Row 0 is the header (blank corner + day names). Each later row is a
    // time block (label + one cell per day, lit if that block is an hour).
    let cells = `<span class="cell"></span>`;                                  // top-left corner
    days.forEach(d => cells += `<span class="cell day">${d}</span>`);          // day headers
    oh.slots.forEach(slot => {
      cells += `<span class="cell time">${slot}</span>`;                       // time label
      days.forEach(d => {
        const on = oh.byDay[d].includes(slot);                                // is this an office hour?
        cells += `<span class="cell slot${on ? " on" : ""}"></span>`;
      });
    });

    const telDigits = "+1" + g.phone.replace(/[^0-9]/g, "");                   // 501-279-4482 -> +15012794482

    $("#guide").innerHTML = head(g) + `
      <div class="panel npc">
        <div class="portrait">
          <img src="${g.photo}" alt="${g.name}, ${g.role}" />
          <p class="door">${g.doorLine}</p>
        </div>
        <div>
          <h3>${g.name}</h3>
          <p class="role">${g.role}</p>
          <dl class="contact">
            <dt>Email</dt><dd><a href="mailto:${g.email}">${g.email}</a></dd>
            <dt>Phone</dt><dd><a href="tel:${telDigits}">${g.phone}</a></dd>
            <dt>Office</dt><dd>${g.office}</dd>
          </dl>
          <div class="oh-head">
            <h4>Office hours</h4>
            <span class="oh-legend"><span class="sw"></span> Scheduled office hours</span>
          </div>
          <div class="oh-grid">${cells}</div>
          <p class="oh-note">${oh.note}</p>
          ${g.calendly ? `<a class="book-btn" href="${g.calendly}" target="_blank" rel="noopener">${icon("ic-clock")}${g.bookLabel}</a>` : ""}
          <p class="closer">${g.closer}</p>
        </div>
      </div>`;
  }

  /* ===================================================================
     RENDER: THE CODE OF THE DUNGEON (policies)
     Native <details>/<summary> = accessible + works without JS.
     =================================================================== */
  function renderCode(){
    const c = CONFIG.code;
    const scrolls = c.policies.map(p => `
      <details class="scroll">
        <summary>${icon("ic-scroll")}<span class="ttl">${p.title}</span><span class="chev">${icon("ic-chevron")}</span></summary>
        <div class="scroll-body">${p.body}</div>
      </details>`).join("");
    $("#code").innerHTML = head(c) + `<div class="scrolls">${scrolls}</div>`;
  }

  /* ===================================================================
     RENDER: FOOTER (+ d20 dice easter egg)
     =================================================================== */
  function renderFooter(){
    const f = CONFIG.footer;
    $("#foot").innerHTML = `
      <div class="wrap">
        <p class="flavor">“${f.flavor}”</p>
        <button class="dice-btn" id="diceBtn">${icon("ic-dice")} Roll for initiative (d20)</button>
        <div class="dice-result" id="diceResult"></div>
        <p class="colophon">${f.colophon}</p>
      </div>`;

    $("#diceBtn").addEventListener("click", () => {
      const roll = 1 + Math.floor(Math.random() * 20);            // 1..20
      const special = f.diceMessages[roll];
      $("#diceResult").innerHTML = special
        ? `You rolled a <b>${roll}</b>. ${special}`
        : `You rolled a <b>${roll}</b>. Onward into the dungeon.`;
    });
  }

  /* ===================================================================
     PAGE CHROME: depth bar, embers, scroll-reveal
     =================================================================== */
  function setupDepthBar(){
    const bar = $("#depthbar");
    const update = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + "%";
    };
    window.addEventListener("scroll", update, { passive:true });
    update();
  }

  function setupEmbers(){
    // Skip the animation entirely for visitors who prefer reduced motion.
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = $("#embers");
    const COUNT = 14;
    for(let i = 0; i < COUNT; i++){
      const e = document.createElement("span");
      e.className = "ember";
      e.style.left = Math.random() * 100 + "vw";
      e.style.animationDuration = (7 + Math.random() * 7) + "s";   // varied drift speed
      e.style.animationDelay = (-Math.random() * 12) + "s";        // stagger so they don't start together
      const scale = 0.6 + Math.random() * 1.4;
      e.style.transform = `scale(${scale})`;
      box.appendChild(e);
    }
  }

  function setupReveal(){
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold:0.12 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  }

  /* ===================================================================
     BOOT — render every section, then wire up the page chrome.
     =================================================================== */
  renderHero();
  renderQuest();
  renderProvisions();
  renderSkills();
  renderLoot();
  renderBosses();
  renderArmory();
  renderMap();
  renderGuide();
  renderCode();
  renderFooter();

  setupDepthBar();
  setupEmbers();
  setupReveal();
  </script>
